<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Section Verification Portal</title>
    <!-- Offline CSS Assets -->
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/font-awesome.min.css">
    <!-- Theme only -- the login page has no app chrome, so esection-shell.css
         (sidebar/topbar/responsive) is deliberately not loaded here. -->
    <link rel="stylesheet" href="../../assets/css/esection-theme.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card glass-card p-4 shadow-sm border-0">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="width: 64px; height: 64px; background: #e0e7ff; border: 1px solid #c7d2fe;">
                            <i class="fa fa-shield fa-2x text-gradient-indigo"></i>
                        </div>
                        <h3 class="fw-bold mb-1 text-dark">E-Section Portal</h3>
                        <p class="text-muted small">Institute of Distance &amp; Open Learning (IDOL)</p>
                    </div>

                    <!-- Flash messages (success/error) are server-driven in the
                         live app; this static reference has no session, so
                         neither banner is rendered here. -->

                    <form action="#" method="post">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-secondary border-opacity-25 text-muted"><i class="fa fa-user"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="e.g. esection1 or admin" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-secondary border-opacity-25 text-muted"><i class="fa fa-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-indigo w-100">
                            <i class="fa fa-sign-in me-2"></i> Log In to Dashboard
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <a href="auth-forgot-password.html" class="small text-muted">Forgot your password?</a>
                    </div>

                    <div class="mt-4 text-center">
                        <small class="text-muted" style="font-size: 0.75rem;">
                            &copy; 2026 IDOL Eligibility Section. All rights reserved.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Offline JS Assets -->
    <script src="../../assets/js/jquery.min.js"></script>
    <script src="../../assets/js/bootstrap.bundle.min.js"></script>
    <script>
        /**
         * Submit-button motion.
         *
         * Ported inline from app/Views/common/es_form_motion_js.php (this
         * static theme has no includes). Dependency-free -- jQuery only,
         * because this auth shell deliberately carries no Select2, SweetAlert
         * or ajax_common_js.
         *
         * What it does: while a form is submitting, its submit button shows a
         * spinner and stops accepting further clicks. Harmless to keep even
         * with action="#" -- there is no backend here to actually submit to.
         */
        (function (window, $) {
            'use strict';

            if (!$) {
                return;
            }

            var BUSY = 'es-btn-busy';

            function startBusy($btn) {
                if ($btn.length === 0 || $btn.hasClass(BUSY)) {
                    return;
                }

                // Width is pinned before the label changes, so the button
                // cannot visibly resize as the spinner replaces the icon.
                $btn.css('min-width', $btn.outerWidth() + 'px');

                $btn.data('es-label', $btn.html())
                    .addClass(BUSY)
                    .prop('disabled', true)
                    .attr('aria-busy', 'true');
            }

            function endBusy($btn) {
                if ($btn.length === 0 || !$btn.hasClass(BUSY)) {
                    return;
                }

                var label = $btn.data('es-label');

                if (typeof label === 'string') {
                    $btn.html(label);
                }

                $btn.removeClass(BUSY)
                    .prop('disabled', false)
                    .removeAttr('aria-busy')
                    .css('min-width', '');
            }

            $(document).on('submit', 'form', function (e) {
                // A submit another handler has cancelled -- client-side
                // validation, a confirmation dialog -- is not a submit.
                // Marking the button busy here would leave it spinning
                // forever on a form that never went anywhere.
                if (e.isDefaultPrevented()) {
                    return;
                }

                var $form = $(this);

                if ($form.is('[data-no-busy]')) {
                    return;
                }

                startBusy($form.find('button[type="submit"], input[type="submit"]').first());
            });

            // Restored from the back/forward cache, the page comes back
            // exactly as it was left -- including a button still spinning
            // from the navigation that took the user away. Always clear it.
            $(window).on('pageshow', function () {
                endBusy($('.' + BUSY));
            });

            window.esButtonBusy = startBusy;
            window.esButtonIdle = endBusy;
        })(window, jQuery);

        /**
         * Show / hide for every password field.
         *
         * Ported inline from app/Views/common/es_password_toggle_js.php (this
         * static theme has no includes). Auto-enhancing on purpose: it finds
         * input[type="password"] itself rather than each view opting in.
         *
         * Dependency-free (jQuery only), because this auth shell deliberately
         * carries no Select2, SweetAlert or ajax_common_js.
         *
         * Two layouts are handled differently, because one markup shape
         * cannot serve both:
         *
         *   inside .input-group   the button is appended as a sibling, so
         *                         Bootstrap's own flex row lays it out and it
         *                         reads as part of the control.
         *
         *   standalone            the input is wrapped in a relative span and
         *                         the button sits over its right padding.
         */
        (function (window, $) {
            'use strict';

            if (!$) {
                return;
            }

            var EYE       = 'fa-eye';
            var EYE_SLASH = 'fa-eye-slash';

            function buttonHtml(extraClass) {
                return '<button type="button" class="es-pw-toggle ' + extraClass + '" '
                     + 'tabindex="-1" aria-pressed="false" aria-label="Show password" '
                     + 'title="Show password"><i class="fa ' + EYE + '" aria-hidden="true"></i></button>';
            }

            function enhance(input) {
                var $input = $(input);

                // Already done, or explicitly opted out.
                if ($input.data('es-pw') || $input.is('[data-no-pw-toggle]')) {
                    return;
                }

                $input.data('es-pw', true);

                var $group = $input.parent('.input-group');
                var $btn;

                if ($group.length) {
                    // Bootstrap lays this out; it must be a direct child of
                    // the group and must come after the input to sit on the
                    // right.
                    $btn = $(buttonHtml('es-pw-toggle--group'));
                    $input.after($btn);
                } else {
                    $input.wrap('<span class="es-pw"></span>');
                    $btn = $(buttonHtml('es-pw-toggle--inline'));
                    $input.after($btn);
                }

                $btn.on('click', function () {
                    var showing = $input.attr('type') === 'text';

                    // Caret position is preserved across the type swap.
                    // Without this the cursor jumps to the end, which is
                    // maddening when someone is checking a character
                    // mid-string.
                    var start = null;
                    var end   = null;

                    try {
                        start = $input[0].selectionStart;
                        end   = $input[0].selectionEnd;
                    } catch (e) {
                        start = null;
                    }

                    $input.attr('type', showing ? 'password' : 'text');

                    // Marks a currently-revealed field, so the pagehide sweep
                    // below can find it.
                    if (showing) {
                        $input.removeAttr('data-es-reveal');
                    } else {
                        $input.attr('data-es-reveal', '1');
                    }

                    $(this)
                        .attr('aria-pressed', showing ? 'false' : 'true')
                        .attr('aria-label', showing ? 'Show password' : 'Hide password')
                        .attr('title', showing ? 'Show password' : 'Hide password')
                        .find('i')
                        .toggleClass(EYE, showing)
                        .toggleClass(EYE_SLASH, !showing);

                    // Focus returns to the field, so revealing a password
                    // does not cost the typist their place in the form.
                    $input.trigger('focus');

                    if (start !== null) {
                        try {
                            $input[0].setSelectionRange(start, end);
                        } catch (e) {
                            // Some input types refuse setSelectionRange;
                            // harmless.
                        }
                    }
                });
            }

            function enhanceAll(root) {
                $(root || document).find('input[type="password"]').each(function () {
                    enhance(this);
                });
            }

            $(function () {
                enhanceAll(document);

                // Fields inside a dialog exist in the DOM already, but a
                // screen that builds a form after load would otherwise be
                // missed.
                $(document).on('shown.bs.modal', function (e) {
                    enhanceAll(e.target);
                });
            });

            // Anything revealed must go back to hidden before the page is
            // left, so a password is never left on screen behind a browser's
            // back/forward cache or in a screenshot of the next page's load.
            $(window).on('pagehide', function () {
                $('input[type="text"][data-es-reveal]').attr('type', 'password');
            });

            window.esEnhancePasswordFields = enhanceAll;
        })(window, jQuery);
    </script>
</body>
</html>
